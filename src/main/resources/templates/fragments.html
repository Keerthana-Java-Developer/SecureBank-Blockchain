
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="nav(user)" class="nav">

    <a class="brand" href="/">
        Secure<span>Bank</span>
    </a>

    <div class="navlinks">
        <a href="/">Home</a>

        <a th:if="${user != null}" href="/dashboard">Dashboard</a>

        <a th:if="${user != null}" href="/transfer">Transfer</a>

        <a th:if="${user != null}" href="/ledger">Ledger</a>

        <a th:if="${user != null}" href="/pki">Security</a>

        <a th:if="${user == null}" href="/login">Sign in</a>

        <a th:if="${user == null}"
           class="navcta"
           href="/signup">Create account</a>

        <form th:if="${user != null}"
              th:action="@{/logout}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
        class="logout-btn"
        style="background-color:#2864ff!important;
               color:#ffffff !important;
               border:none;
               border-radius:10px;
               padding:12px 19px;
               font-family:inherit;
               font-size:14px;
               font-weight:700;
               cursor:pointer;">
    Sign out
</button>
        </form>
    </div>

</nav>

</body>
</html>
